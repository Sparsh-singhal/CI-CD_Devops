name: Release Watcher

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
    watch:
        runs-on: ubuntu-latest
        steps:
        - name: Print triggering event name
          run: echo "Triggered by event ${{ github.event_name }}"

        - name: Print current date and time
          run: date

        - name: Finish release watch
          run: echo "Release watch complete"