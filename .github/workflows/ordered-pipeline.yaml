name: ordered pipeline

on:
    # push:
    workflow_dispatch:

jobs:
    setup:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.x'

            - name: Setup done
              run: echo "Setup done"
    verify:
        runs-on: ubuntu-latest
        needs: setup
        steps:
            - name: Check out again
              uses: actions/checkout@v4
            - name: Runntime version
              run: node -v
            - name: Verify setup
              run: echo "Verify Done"
    finish:
        runs-on: ubuntu-latest
        needs: verify
        steps:
            - name: Finishing work
              run: echo "Verify done"