name: Using Actions

on: #push:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: react-app
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version: '24.x'
            - name: install dependencies
              run: npm ci
            - name: Run tests
              run: npm run test
