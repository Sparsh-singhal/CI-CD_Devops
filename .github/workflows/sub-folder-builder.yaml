name: Subfolder Builder

on:
    push:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: react-app
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.x'

            - name: Current working directory
              run: pwd

            - name: List files
              run: ls -la

            - name: Confirm build folder
              run: echo "Build folder confirmed"
